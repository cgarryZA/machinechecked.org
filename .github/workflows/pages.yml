name: Site

# Publishes machinechecked.org. Installs the MachineChecked package TOOL_VERSION pins (a
# released version, or a commit), pure Python with no Lean or TeX, for its built reader;
# assembles the site; tests it in a browser (tests/site.test.mjs); and deploys it from main only.
# A run on another branch (a proposed reader update, see update-reader.yml) tests and stops.
# Pages must have "GitHub Actions" as its source (Settings > Pages).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * *"   # daily: lists an audit once it answers, drops one that stopped

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the reader's package, and poppler to read the papers' PDFs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
          v=$(cat TOOL_VERSION)
          if [[ "$v" =~ ^[0-9a-f]{40}$ ]]; then
            pip install "machinechecked @ git+https://github.com/cgarryZA/MachineChecked@$v"
          else
            pip install "machinechecked==$v"
          fi
      - name: Statements already found in the papers' PDFs
        uses: actions/cache@v4
        with:
          path: .cache/claims
          key: claims-${{ hashFiles('TOOL_VERSION', 'registry/**/*.json') }}
          restore-keys: claims-
      - run: pip install pytest && python -m pytest -q tests
      - run: python scripts/build.py --out _site --claims-cache .cache/claims --check-audits
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The site in a browser, with this reader
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/site.test.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
